<div class="radio-player-container">
  <div class="player-main-info">
    <div class="radio-icon text-xl sm:text-[24px]">
      <fa-icon [icon]="faRadio"></fa-icon>
    </div>
    <p class="radio-title mr-3 sm:mr-0">RÁDIO ABAPAI RN</p>
    <div class="sm:w-[180px] h-[24px] flex justify-end sm:justify-center items-center gap-4">
      <audio #audioPlayer preload="none">
        <source src="https://hts01.brascast.com:12044/live" />
        Your browser does not support the audio tag.
      </audio>

      <div class="play-back-button">
        <fa-icon [icon]="faBackwardStep"></fa-icon>
      </div>

      <div class="play-pause-button" (click)="toggleAudio()">
        @if (isPlaying) {
          <fa-icon [icon]="faPause"></fa-icon>
        } @else {
          <fa-icon [icon]="faPlay"></fa-icon>
        }
      </div>

      <div class="play-forward-button">
        <fa-icon [icon]="faForwardStep"></fa-icon>
      </div>

      <div class="volume-slider flex">
        <input
          type="range"
          min="0"
          max="100"
          [value]="volume"
          (input)="handleVolumeChange($event)"
        />
      </div>
    </div>
  </div>
  <div class="playing-now-container text-xs sm:text-sm">
    <div class="scrolling-text">{{ playingNow }}</div>
  </div>
</div>
