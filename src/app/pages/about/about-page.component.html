<div class="min-h-[calc(100vh-480px)] flex flex-col items-center">
  <div
    class="top-container w-full h-[160px] md:h-[230px] flex justify-center items-center"
    #donationsRef
    style="
      background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.142) 0%,
          rgba(0, 0, 0, 0) 98.58%
        ),
        url('assets/imagem_culto.jpg');
      background-size: cover;
      background-position: center;
    "
  >
    <h1 class="text-white font-bold text-3xl md:text-5xl">SOBRE NÓS</h1>
  </div>
  <div class="w-[88%] md:w-[75%] max-w-[1200px] flex flex-col justify-between py-16">
    <div class="md:hidden mb-10">
      <img class="w-full" src="assets/montagem_about.jpg" />
    </div>

    <div *ngIf="loading" class="text-center py-8">
      <div
        class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"
      ></div>
      <p class="text-gray-500">Carregando conteúdo...</p>
    </div>

    <div
      *ngIf="error"
      class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6"
    >
      {{ error }}
    </div>

    <!-- Content -->
    <div *ngIf="!loading && !error">
      <h2 class="font-semibold text-[28px] mb-4">Quem Somos</h2>
      <div class="w-full flex flex-col md:flex-row gap-[60px]">
        <div class="md:w-[50%] flex flex-col gap-3 text-justify leading-8">
          <div [innerHTML]="getWhoWeAreContent()"></div>
        </div>
        <div class="w-[45%] hidden md:block">
          <img class="w-full" src="assets/montagem_about.jpg" />
        </div>
      </div>
      <div class="w-full h-[1px] bg-blue-900 mt-20 mb-[60px]"></div>
      <h2 class="font-semibold text-[28px] mb-4">Nossa Missão</h2>
      <div class="text-justify leading-8 mb-10">
        <div [innerHTML]="getOurMissionContent()"></div>
      </div>
      <h2 class="font-semibold text-[28px] mb-4">Nossos Valores</h2>
      <div class="text-justify leading-8 mb-10">
        <div [innerHTML]="getOurValuesContent()"></div>
      </div>
    </div>
  </div>
</div>
