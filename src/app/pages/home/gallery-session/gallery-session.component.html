<div class="content-container py-[60px] sm:py-[110px]" #galleryRef>
  <div class="title-container w-[85%]">
    <h1 class="title text-center">Ministério Cristão Aba Pai</h1>
    <div class="subtitle-wrapper">
      <p class="subtitle">
        "Porque não recebestes o espírito de escravidão, para outra vez estardes com
        temor, mas recebestes o espírito de adoção, pelo qual clamamos: Aba, Pai!"
      </p>
      <p class="subtitle">Romanos 8:15</p>
    </div>
  </div>
  <div class="mt-[50px] grid grid-cols-2 xl:grid-cols-4 gap-[5vw] sm:gap-10 xl:gap-x-[60px] xl:gap-y-[40px]">
    @for (image of images; track image) {
      <img [src]="image" class="img w-[44vw] h-[34vw] sm:w-[280px] sm:h-[220px]" />
    }
  </div>
</div>
